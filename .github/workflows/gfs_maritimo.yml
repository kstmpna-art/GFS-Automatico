name: Enviar GRIB marítimo

on:
  schedule:
    # 08:45 UTC = 05:45 ART | 20:45 UTC = 17:45 ART
    - cron: "45 8,20 * * *"
  workflow_dispatch:

concurrency:
  group: gfs-maritimo-programado
  cancel-in-progress: false

jobs:
  generar-y-enviar:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Generar GRIB2 marítimo
        run: |
          python descargar_gfs_xygrib_olas.py \
            --norte -40 \
            --sur -46 \
            --oeste -66 \
            --este -59 \
            --horas 120 \
            --paso 6

      - name: Detectar archivo GRIB generado
        shell: bash
        run: |
          GRIB_FILE=$(find . -maxdepth 1 -type f \
            \( -name "gfs*.grb2" -o -name "gfs*.grb" \) \
            ! -name "*.parcial" \
            -printf "%T@ %p\n" |
            sort -nr |
            head -n 1 |
            cut -d" " -f2-)

          if [ -z "$GRIB_FILE" ]; then
            echo "ERROR: no se encontró ningún archivo GRIB generado."
            exit 1
          fi

          GRIB_FILE="${GRIB_FILE#./}"

          echo "Archivo encontrado: $GRIB_FILE"
          echo "GRIB_FILE=$GRIB_FILE" >> "$GITHUB_ENV"

      - name: Mostrar información del archivo
        run: |
          ls -lh "$GRIB_FILE"
          echo "Se enviará: $GRIB_FILE"

      - name: Conservar GRIB como artefacto
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: gfs-maritimo-${{ github.run_number }}
          path: ${{ env.GRIB_FILE }}
          retention-days: 3
          if-no-files-found: error

      - name: Enviar por Gmail
        env:
          MAIL_USER: ${{ secrets.MAIL_USER }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          MAIL_DESTINO: ${{ secrets.MAIL_DESTINO }}
        run: |
          python enviar_grib.py "$GRIB_FILE"
