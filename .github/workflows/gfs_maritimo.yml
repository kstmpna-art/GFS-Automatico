name: Enviar GRIB marítimo

on:
  schedule:
    # 08:45 UTC = 05:45 ART | 20:45 UTC = 17:45 ART
    - cron: "45 6,18 * * *"
  workflow_dispatch:

concurrency:
  group: gfs-maritimo-programado
  cancel-in-progress: false

jobs:
  generar-y-enviar:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Generar GRIB2 marítimo grande
        run: |
          python descargar_gfs_xygrib_olas.py \
            --norte -35 \
            --sur -60 \
            --oeste -85 \
            --este -55 \
            --horas 168 \
            --paso 3

      - name: Detectar archivo GRIB generado
        shell: bash
        run: |
          GRIB_FILE=$(find . -maxdepth 1 -type f \
            \( -name "gfs*.grb2" -o -name "gfs*.grb" \) \
            ! -name "*.parcial" \
            -printf "%T@ %p\n" |
            sort -nr |
            head -n 1 |
            cut -d" " -f2-)

          if [ -z "$GRIB_FILE" ]; then
            echo "ERROR: no se encontró ningún archivo GRIB generado."
            exit 1
          fi

          GRIB_FILE="${GRIB_FILE#./}"

          echo "Archivo encontrado: $GRIB_FILE"
          echo "GRIB_FILE=$GRIB_FILE" >> "$GITHUB_ENV"

      - name: Mostrar información del archivo
        run: |
          ls -lh "$GRIB_FILE"
          echo "Se enviará: $GRIB_FILE"

      - name: Conservar GRIB como artefacto
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: gfs-maritimo-${{ github.run_number }}
          path: ${{ env.GRIB_FILE }}
          retention-days: 3
          if-no-files-found: error

      - name: Enviar por Gmail
        env:
          MAIL_USER: ${{ secrets.MAIL_USER }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          MAIL_DESTINO: ${{ secrets.MAIL_DESTINO }}
        run: |
          python enviar_grib.py "$GRIB_FILE"

      - name: Enviar alerta por Correo Electrónico si falla
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "⚠️ ALERTA: Fallo en el envío automático de GFS Marítimo"
          to: ${{ secrets.MAIL_DESTINATARIOS }}
          from: "Alerta GFS Marítimo <${{ secrets.MAIL_USERNAME }}>"
          html_body: |
            <h2>⚠️ El envío automático del archivo GRIB2 ha fallado</h2>
            <p>Se ha detectado un error al procesar el reporte meteorológico programado.</p>
            <p>Por favor, ingresa al panel de control web para forzar el envío manualmente:</p>
            <p><a href="https://kstmpna-art.github.io/GFS-Automatico/" style="background:#007bff; color:white; padding:10px 15px; text-decoration:none; border-radius:5px; font-weight:bold;">Ir al Panel de Control</a></p>

      - name: Enviar alerta por Telegram si falla
        if: failure()
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          MSG="⚠️ *ALERTA GFS MARÍTIMO*%0AEl envío automático del GRIB2 ha fallado.%0A%0AIngresá al panel para enviarlo manualmente:%0Ahttps://kstmpna-art.github.io/GFS-Automatico/"
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            -d "text=${MSG}" \
            -d "parse_mode=Markdown"
