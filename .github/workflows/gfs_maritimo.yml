name: Enviar GRIB marítimo

on:
  schedule:
    # 09:00 UTC = 06:00 ART | 21:00 UTC = 18:00 ART
    - cron: "15 9,21 * * *"
  workflow_dispatch:

concurrency:
  group: gfs-maritimo-programado
  cancel-in-progress: false

jobs:
  generar-y-enviar:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Generar GRIB2 marítimo
        run: |
          python descargar_gfs_xygrib_olas.py \
            --norte -40 \
            --sur -46 \
            --oeste -66 \
            --este -59 \
            --horas 120 \
            --paso 6 \
            --salida gfs_maritimo.grb2

      - name: Conservar GRIB como artefacto
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: gfs-maritimo-${{ github.run_number }}
          path: gfs_maritimo.grb2
          retention-days: 3
          if-no-files-found: error

      - name: Enviar por Gmail
        env:
          MAIL_USER: ${{ secrets.MAIL_USER }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          MAIL_DESTINO: ${{ secrets.MAIL_DESTINO }}
        run: python enviar_grib.py gfs_maritimo.grb2
